<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="todolist">
    <div class="title">moon todolist</div>
    <div class="todoform">
        <input class="todoinput" type="text" placeholder="add a todo" />
        <div class="todobutton">add todo</div>
    </div>

    <div class="item completed">
        <div>
            <input type="checkbox" />
            <span class="name">food</span>
        </div> 
        <div class="del">del</div>
    </div>
    <div class="item">
        <div>
            <input type="checkbox" />
            <span class="name">food</span>
        </div> 
        <div class="del">del</div>
    </div>
    <div class="item">
        <div>
            <input type="checkbox" />
            <span class="name">food</span>
        </div> 
        <div class="del">del</div>
    </div>
    </div>
    <style>
        body{
            background: linear-gradient(to right, rgb(231, 191, 231), rgb(167, 167, 230));
        }
        .completed{
            text-decoration: line-through;
            opacity: 0.4;
        }
        .del{
            color: red;
        }
        .item{
            display: flex;
            align-items: center;
            justify-content: space-between;

            box-sizing: border-box;
            width: 80%;
            height: 50px;
            margin: 8px auto;
            padding: 16px;
            border-radius: 20px;
            box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 20px;
        }
        .todobutton{
            width: 100px;
            height: 52px;
            border-radius: 0 20px 20px 0;
            line-height: 52px;
            text-align: center;
            background: linear-gradient(
                to right, rgb(231, 191, 231), rgb(167, 167, 230)
            );
            color: #ffff;
            cursor: pointer;
            user-select: none;
        }
        .todoinput{
            border: 1px solid #dfe1e5;
            outline: none;
            height: 50px;
            width: 60%;
            border-radius: 20px 0 0 20px;
            padding-left: 15px;
            margin-bottom: 20px;
        }
        .todoform{
            display: flex;
            margin-top: 20px;
            margin-left: 30px;
        }
        .todolist{
            width: 98%;
            height: 500px;
            background-color: #ffff;
            border-radius: 5px;
            margin-top: 40px;
            margin-left: 1%;
            padding-top: 30px;
            box-sizing: border-box;
        }
        .title{
            font-size: 30px;
            font-weight: 700;
            text-align: center;
        }
    </style>
</body>
</html>
